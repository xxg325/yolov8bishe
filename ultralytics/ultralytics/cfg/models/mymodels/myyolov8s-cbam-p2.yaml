# yolov8-cbam-p2.yaml by ultralytics, modified by zhixingong

# Parameters
nc: 4 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0-p2 head with CBAM
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11 cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14 cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 2], 1, Concat, [1]] # 17 cat backbone P2
  - [-1, 3, C2f, [128]] # 18 (P2/4-xsmall)
  - [-1, 1, CBAM, [128, 7]] # 19 CBAM for P2

  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 15], 1, Concat, [1]] # 21 cat head P3
  - [-1, 3, C2f, [256]] # 22 (P3/8-small)
  - [-1, 1, CBAM, [256, 7]] # 23 CBAM for P3

  - [-1, 1, Conv, [256, 3, 2]] # 24
  - [[-1, 12], 1, Concat, [1]] # 25 cat head P4
  - [-1, 3, C2f, [512]] # 26 (P4/16-medium)
  - [-1, 1, CBAM, [512, 7]] # 27 CBAM for P4

  - [-1, 1, Conv, [512, 3, 2]] # 28
  - [[-1, 9], 1, Concat, [1]] # 29 cat head P5
  - [-1, 3, C2f, [1024]] # 30 (P5/32-large)
  - [-1, 1, CBAM, [1024, 7]] # 31 CBAM for P5

  - [[19, 23, 27, 31], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)